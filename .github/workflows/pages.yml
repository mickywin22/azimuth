name: Deploy site to GitHub Pages

# Builds the public static site (scripts/build_site.py -> ./_site) and publishes it
# to GitHub Pages on every push to main, plus a manual trigger.
#
# READY-TO-FLIP GATE (skip-not-fail): this workflow only DEPLOYS once GitHub Pages is actually
# ENABLED in the repo settings (Settings -> Pages -> Source: "GitHub Actions"). Enabling it is
# Michael's manual, explicitly-confirmed infra step. Until then actions/deploy-pages 404s
# ("Ensure GitHub Pages has been enabled"), reddening every push.
#
# The old gate keyed on repository *visibility* (`!github.event.repository.private`). That went
# stale the moment the repo was flipped public: build+deploy then ran and 404'd because Pages was
# still not enabled. The real blocker is Pages *enablement*, not visibility — so the `preflight`
# job below probes the Pages API and skips (green) until it is enabled, then auto-deploys on the
# next push with no further change here. See docs/deploy.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token scopes required by actions/deploy-pages (deploy job) + the Pages-status
# probe (preflight job). Scoped per-job below; this top-level block is the union.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate: is GitHub Pages actually enabled? The secrets/settings context needed for this is not
  # available in a job `if:`, so probe the Pages REST API and surface the verdict as an output the
  # build + deploy jobs gate on. 200 = enabled -> deploy; anything else (typically 404 while Pages
  # is off) = skip green. This never red-fails an un-provisioned repo.
  preflight:
    name: Is GitHub Pages enabled?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.probe.outputs.enabled }}
    steps:
      - name: Probe the Pages API
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled — building and deploying."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled (HTTP $code) — skipping deploy. Enable it (Settings -> Pages -> Source: GitHub Actions; Michael's gated infra step) and the next push auto-deploys."
          fi

  build:
    name: Build static site
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # `site` (Markdown renderer) + `ld` (rdflib) — both DEV/CI-only; the runtime stays
      # pure-stdlib. `ld` powers the linked-data export step below.
      - name: Install site build deps
        run: uv pip install --system -e ".[site,ld]"

      - name: Build site
        run: python scripts/build_site.py --out _site

      # Publish the RDF graph BESIDE the static site: schema.ttl + data.ttl + the composed
      # context, lifted from the vault/ OKF bundle (Vault-LD OKF profile, SPEC Appendix B).
      # This whole build job is enablement-gated (needs.preflight.outputs.enabled), so the .ttl
      # only ever deploys once Michael enables Pages — nothing publishes early.
      - name: Export linked data (schema.ttl + data.ttl) beside the site
        run: python scripts/build_rdf.py --out _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: [preflight, build]
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
