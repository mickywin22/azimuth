repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20  # keep in lock-step with the pyproject `ruff>=0.15,<0.16` bound + CI
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.10.0, fastapi>=0.115.0]
        args: [--ignore-missing-imports]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: source-guardrail
        name: Per-source license + content guardrail
        entry: python scripts/check_sources.py
        language: system
        pass_filenames: false
        files: ^(sources/registry\.json|CREDITS\.md|scripts/check_sources\.py|guardrail/)
      - id: synthesis-lint
        name: L2 synthesis lint (claim-sourcing, editorial, evolve, diff-guard)
        entry: python scripts/check_synthesis.py
        language: system
        pass_filenames: false
        files: ^(vault/02 Briefs/|vault/00 Rules/|synthesis/|scripts/check_synthesis\.py)
      - id: brief-index-sync
        name: L2 brief index in sync with briefs
        entry: python scripts/build_brief_index.py --check
        language: system
        pass_filenames: false
        files: ^(vault/02 Briefs/|sources/registry\.json|scripts/build_brief_index\.py)
      - id: graph-sync
        name: Cross-channel knowledge graph in sync with vault
        entry: python scripts/build_graph.py --check
        language: system
        pass_filenames: false
        files: ^(vault/01 Sources/|vault/02 Briefs/|sources/registry\.json|scripts/build_graph\.py)
      - id: linked-data-sync
        name: Linked-data explorer in sync with vault
        entry: python scripts/build_linked_data.py --check
        language: system
        pass_filenames: false
        files: ^(vault/00 Rules/|vault/01 Sources/|vault/02 Briefs/|sources/registry\.json|scripts/build_linked_data\.py|scripts/build_rdf\.py|vault/context\.jsonld|vault/ontology/)
      - id: good-first-issues-sync
        name: Good-first-issues catalog in sync with the seeder
        entry: python scripts/seed_good_first_issues.py --check
        language: system
        pass_filenames: false
        files: ^(scripts/seed_good_first_issues\.py|\.github/GOOD_FIRST_ISSUES\.md)$
      - id: okf-conformance
        name: OKF v0.1 conformance (type on every concept + reserved files)
        entry: python scripts/check_okf_conformance.py
        language: system
        pass_filenames: false
        files: ^(vault/00 Rules/|vault/01 Sources/|vault/02 Briefs/|scripts/check_okf_conformance\.py)
      - id: okf-reserved-sync
        name: OKF reserved index.md / log.md in sync with the bundle
        entry: python scripts/build_okf_reserved.py --check
        language: system
        pass_filenames: false
        files: ^(vault/00 Rules/|vault/01 Sources/|vault/02 Briefs/|vault/index\.md|vault/log\.md|scripts/build_okf_reserved\.py)
      - id: doc-links
        name: Documentation links resolve (no dead relative Markdown links)
        entry: python scripts/check_doc_links.py
        language: system
        pass_filenames: false
        files: \.md$|^scripts/check_doc_links\.py$
      - id: doc-orphans
        name: Documentation has no orphans (every docs/ page is reachable)
        entry: python scripts/check_doc_orphans.py
        language: system
        pass_filenames: false
        files: \.md$|^scripts/check_doc_(links|orphans)\.py$
      - id: secret-scan
        name: Secret scan (working tree) -- public-flip gate C1
        entry: python scripts/scan_secrets.py --worktree
        language: system
        pass_filenames: false
        always_run: true
      - id: private-leakage-scan
        name: Private-leakage scan (working tree) -- public-flip gate C1b
        entry: python scripts/scan_private_leakage.py --worktree
        language: system
        pass_filenames: false
        always_run: true
